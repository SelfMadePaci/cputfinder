<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPUT Finder - Schedules</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="top-nav"><div class="logo-area"><img src="../images/cput-logo.png" alt="CPUT Logo" class="logo"></div><nav class="nav-links"><a href="courses.html">Courses</a><a href="rooms.html">Rooms</a><a href="schedules.html" class="active">Schedules</a><a href="#" onclick="logout();return false;">Logout</a></nav></header>
<main class="crud-page"><section class="crud-card"><h1>Schedule Records</h1><p class="subtitle">Manage timetable entries linked to students, courses, and rooms.</p><form id="scheduleForm"><input type="hidden" id="scheduleId"><div class="crud-fields"><label>Student<select id="scheduleStudent" required></select></label><label>Course<select id="scheduleCourse" required></select></label><label>Room<select id="scheduleRoom" required></select></label><label>Date<input id="scheduleDate" type="date" required></label><label>Start time<input id="scheduleStart" type="time" required></label><label>End time<input id="scheduleEnd" type="time" required></label></div><button class="btn-primary" type="submit" id="scheduleSubmit">Create schedule</button><button class="btn-secondary" type="button" id="cancelSchedule" hidden>Cancel edit</button><p id="scheduleStatus" class="form-status" role="status" aria-live="polite"></p></form><div class="table-wrap"><table class="student-table"><thead><tr><th>Date</th><th>Time</th><th>Course</th><th>Room</th><th>Actions</th></tr></thead><tbody id="scheduleRows"></tbody></table></div></section></main><script src="../js/script.js?v=schedule-fix-4"></script></body></html>
