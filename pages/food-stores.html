<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPUT Finder - Food Stores</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="top-nav"><div class="logo-area"><img src="../images/cput-logo.png" alt="CPUT Logo" class="logo"></div><nav class="nav-links"><a href="courses.html">Courses</a><a href="food-stores.html" class="active">Food Stores</a><a href="#" onclick="logout();return false;">Logout</a></nav></header>
<main class="crud-page"><section class="crud-card"><h1>Food Store Records</h1><p class="subtitle">Manage cafeteria stores and their campus buildings.</p><form id="foodStoreForm"><input type="hidden" id="foodStoreId"><div class="crud-fields"><label>Store name<input id="foodStoreName" required></label><label>Operating hours<input id="foodStoreHours" placeholder="07:00-17:00" required></label><label>Food type<input id="foodStoreType" required></label><label>Building<select id="foodStoreBuilding" required></select></label></div><button class="btn-primary" type="submit" id="foodStoreSubmit">Create food store</button><button class="btn-secondary" type="button" id="cancelFoodStore" hidden>Cancel edit</button><p id="foodStoreStatus" class="form-status" role="status" aria-live="polite"></p></form><label class="record-search">Search food stores<input id="foodStoreSearch" type="search" placeholder="Store, type, or building"></label><div class="table-wrap"><table class="student-table"><thead><tr><th>Store</th><th>Hours</th><th>Type</th><th>Building</th><th>Actions</th></tr></thead><tbody id="foodStoreRows"></tbody></table></div></section></main><script src="../js/script.js?v=food-store-fix"></script></body></html>
