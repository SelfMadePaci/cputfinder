<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPUT Finder - Courses</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="top-nav"><div class="logo-area"><img src="../images/cput-logo.png" alt="CPUT Logo" class="logo"></div><nav class="nav-links"><a href="courses.html" class="active">Courses</a><a href="lecturers.html">Lecturers</a><a href="#" onclick="logout();return false;">Logout</a></nav></header>
<main class="crud-page"><section class="crud-card"><h1>Course Records</h1><p class="subtitle">Manage courses and their lecturer relationships.</p><form id="courseForm"><input type="hidden" id="courseId"><div class="crud-fields"><label>Course code<input id="courseCode" required></label><label>Course name<input id="courseName" required></label><label>Lecturer<select id="courseLecturer" required></select></label></div><button class="btn-primary" type="submit" id="courseSubmit">Create course</button><button class="btn-secondary" type="button" id="cancelCourse" hidden>Cancel edit</button><p id="courseStatus" class="form-status" role="status" aria-live="polite"></p></form><label class="record-search">Search courses<input id="courseSearch" type="search" placeholder="Code, name, or lecturer"></label><div class="table-wrap"><table class="student-table"><thead><tr><th>Code</th><th>Name</th><th>Lecturer</th><th>Actions</th></tr></thead><tbody id="courseRows"></tbody></table></div></section></main><script src="../js/script.js?v=course-fix"></script></body></html>
