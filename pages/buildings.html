<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPUT Finder - Buildings</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="top-nav">
    <div class="logo-area"><img src="../images/cput-logo.png" alt="CPUT Logo" class="logo"></div>
    <nav class="nav-links"><a href="students.html">Students</a><a href="buildings.html" class="active">Buildings</a><a href="rooms.html">Rooms</a><a href="courses.html">Courses</a><a href="lecturers.html">Lecturers</a><a href="food-stores.html">Food Stores</a><a href="schedules.html">Schedules</a><a href="#" onclick="logout(); return false;">Logout</a></nav>
  </header>
  <main class="crud-page">
    <section class="crud-card">
      <h1>Building Records</h1>
      <p class="subtitle">Manage campus locations used by the CPUT Finder map.</p>
      <form id="buildingForm">
        <input type="hidden" id="buildingId">
        <div class="crud-fields">
          <label>Building name<input id="buildingName" required></label>
          <label>Building code<input id="buildingCode" required></label>
          <label class="full-field">Description<textarea id="buildingDescription" required></textarea></label>
        </div>
        <button class="btn-primary" type="submit" id="buildingSubmit">Create building</button>
        <button class="btn-secondary" type="button" id="cancelBuilding" hidden>Cancel edit</button>
        <p id="buildingStatus" class="form-status" role="status" aria-live="polite"></p>
      </form>
      <label class="record-search">Search buildings<input id="buildingSearch" type="search" placeholder="Name or code"></label>
      <div class="table-wrap"><table class="student-table"><thead><tr><th>Name</th><th>Code</th><th>Description</th><th>Actions</th></tr></thead><tbody id="buildingRows"></tbody></table></div>
    </section>
  </main>
  <script src="../js/script.js"></script>
</body>
</html>
