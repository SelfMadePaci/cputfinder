<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPUT Finder - Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="login-page">
    <!-- Navigation -->
    <header class="top-nav">
      <div class="logo-area">
        <button class="hamburger" id="hamburger" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <img src="../images/cput-logo.png" alt="CPUT Logo" class="logo">
      </div>
    </header>

    <!-- Login Form -->
    <main class="login-container">
      <div class="login-card">
        <h1>Login to your CPUT Finder account</h1>
        

        <form id="loginForm">
          <div class="input-group">
            <label for="studentEmail">Student Email</label>
            <input type="email" id="studentEmail" placeholder="Enter your CPUT email" required>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn-primary">Login</button>
          <p id="loginStatus" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <p class="register-text">
          Don't have an account? <a href="register.html">Register</a>
        </p>
      </div>
    </main>
  </div>

  <script src="../js/script.js"></script>
</body>

</html>
